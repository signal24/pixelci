openapi: 3.0.3
info:
  title: OpenAPI
  contact: {}
  license:
    name: MIT
  version: 0.0.1
servers: []
paths:
  /api/session/me:
    get:
      tags:
        - session
      operationId: getSessionGetIdentity
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionResponse"
  /api/session/providers:
    get:
      tags:
        - session
      operationId: getSessionGetProviders
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ISessionProvider"
  /api/session/providers/{id}/login-url:
    get:
      tags:
        - session
      operationId: getSessionGetProviderLoginUrl
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - in: query
          name: redirectUri
          schema:
            type: string
          required: true
        - in: query
          name: state
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url
  /api/session/onboarding-status:
