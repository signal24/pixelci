  /api/session/login:
    post:
      tags:
        - session
      operationId: postSessionLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISessionLoginRequest"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionLoginResponse"
  /api/apps:
    get:
      tags:
