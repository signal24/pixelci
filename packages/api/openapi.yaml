openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: "@zyno-io/pixelci-api"
  version: 0.3.0
paths:
  /api/session/me:
    get:
      operationId: getSessionGetIdentity
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionResponse"
  /api/session/providers:
    get:
      operationId: getSessionGetProviders
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ISessionProvider"
  /api/session/providers/{id}/login-url:
    get:
      operationId: getSessionGetProviderLoginUrl
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: redirectUri
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
  /api/session/onboarding-status:
    get:
      operationId: getSessionGetOnboardingStatus
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IOnboardingStatusResponse"
  /api/session/onboarding/vcs-integration:
    post:
      operationId: postSessionCreateOnboardingVcsIntegration
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickVcsIntegrationEntity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IOnboardingVcsIntegrationInput"
  /api/session/login:
    post:
      operationId: postSessionLogin
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionLoginResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISessionLoginRequest"
  /api/apps:
    get:
      operationId: getAppsIndex
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IAppIndexResponse"
    post:
      operationId: postAppsCreate
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppIndexResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAppCreateInput"
  /api/apps/{id}:
    get:
      operationId: getAppsShow
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppShowResponse"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: putAppsUpdate
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppIndexResponse"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAppUpdateInput"
    delete:
      operationId: deleteAppsDelete
      tags:
        - apps
      responses:
        "200":
          description: OK
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/apps/vcs-projects/search:
    get:
      operationId: getAppsSearchVcsProjects
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IVcsProject"
      parameters:
        - name: vcsId
          in: query
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: true
          schema:
            type: string
  /api/apps/vcs-projects/resolve:
    get:
      operationId: getAppsResolveVcsProject
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IVcsProject"
      parameters:
        - name: vcsId
          in: query
          required: true
          schema:
            type: string
        - name: url
          in: query
          required: true
          schema:
            type: string
  /api/apps/{appId}/branches:
    get:
      operationId: getBranchesIndex
      tags:
        - branches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IBranchResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds:
    get:
      operationId: getBuildsIndex
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IBuildResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: branchId
          in: query
          required: false
          schema:
            type: string
    post:
      operationId: postBuildsCreate
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds/{id}:
    get:
      operationId: getBuildsGet
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds/{id}/status:
    get:
      operationId: getBuildsShow
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildBasicResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds/{id}/process:
    post:
      operationId: postBuildsProcess
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds/{id}/approve:
    post:
      operationId: postBuildsApprove
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildApprovalResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds/{id}/screens:
    get:
      operationId: getBuildScreensGetScreens
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IBuildScreenResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
    post:
      operationId: postBuildScreensUploadScreen
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/IBuildScreenCreateResponse"
                  - type: object
                    properties:
                      status:
                        type: string
                    required:
                      - status
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
                - image
  /api/apps/{appId}/builds/{id}/screens/{screenId}/image:
    get:
      operationId: getBuildScreensGetScreenImage
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: screenId
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds/{id}/screens/{screenId}/diff:
    get:
      operationId: getBuildScreensGetScreenDiff
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: screenId
          in: path
          required: true
          schema:
            type: string
  /api/apps/{appId}/builds/{id}/screens/{screenId}/review:
    post:
      operationId: postBuildScreensReviewScreen
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildScreenReviewResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: screenId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewStatus:
                  enum:
                    - approved
                    - rejected
                  type: string
                comment:
                  type: string
              required:
                - reviewStatus
                - comment
  /api/admin/vcs-integrations:
    get:
      operationId: getVcsIntegrationsIndex
      tags:
        - vcsIntegrations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IVcsIntegrationListResponse"
    post:
      operationId: postVcsIntegrationsCreate
      tags:
        - vcsIntegrations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IVcsIntegrationListResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IVcsIntegrationCreateInput"
  /api/admin/vcs-integrations/{id}:
    get:
      operationId: getVcsIntegrationsShow
      tags:
        - vcsIntegrations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IVcsIntegrationDetailResponse"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    put:
      operationId: putVcsIntegrationsUpdate
      tags:
        - vcsIntegrations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IVcsIntegrationListResponse"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IVcsIntegrationUpdateInput"
    delete:
      operationId: deleteVcsIntegrationsDelete
      tags:
        - vcsIntegrations
      responses:
        "200":
          description: OK
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /api/admin/users:
    get:
      operationId: getUsersIndex
      tags:
        - users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IUserListResponse"
  /api/admin/users/{id}:
    put:
      operationId: putUsersUpdate
      tags:
        - users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  isAdmin:
                    type: boolean
                required:
                  - id
                  - isAdmin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IUserUpdateInput"
  /api/ext/apps:
    get:
      operationId: getExternalReadListApps
      tags:
        - externalRead
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IExtAppResponse"
  /api/ext/apps/{appId}/builds:
    get:
      operationId: getExternalReadListBuilds
      tags:
        - externalRead
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IExtBuildResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: branchId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
  /api/ext/apps/{appId}/builds/{buildId}:
    get:
      operationId: getExternalReadGetBuild
      tags:
        - externalRead
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IExtBuildDetailResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: buildId
          in: path
          required: true
          schema:
            type: string
  /api/ext/apps/{appId}/builds/{buildId}/screens/{screenId}/image:
    get:
      operationId: getExternalReadGetScreenImage
      tags:
        - externalRead
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: buildId
          in: path
          required: true
          schema:
            type: string
        - name: screenId
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            enum:
              - new
              - diff
            type: string
components:
  schemas:
    ISessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
        isAdmin:
          type: boolean
      required:
        - id
        - name
        - isAdmin
    ISessionProvider:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
      required:
        - id
        - name
    IOnboardingStatusResponse:
      type: object
      properties:
        isOnboarded:
          type: boolean
      required:
        - isOnboarded
    IOnboardingVcsIntegrationInput:
      type: object
      properties:
        name:
          type: string
        platform:
          enum:
            - gitlab
            - github
          type: string
        config:
          $ref: "#/components/schemas/IGitLabConfig"
      required:
        - name
        - platform
        - config
    IGitLabConfig:
      type: object
      properties:
        url:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
      required:
        - url
        - clientId
        - clientSecret
    PickVcsIntegrationEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
        platform:
          enum:
            - gitlab
            - github
          type: string
      required:
        - id
        - name
        - platform
    ISessionLoginRequest:
      type: object
      properties:
        providerId:
          type: string
        redirectUri:
          type: string
        code:
          type: string
      required:
        - providerId
        - redirectUri
        - code
    ISessionLoginResponse:
      type: object
      properties:
        jwt:
          type: string
      required:
        - jwt
    IAppIndexResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        defaultBranchId:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
        buildCount:
          type: number
    IAppShowResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        vcsId:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        projectPath:
          type: string
        vcsProjectId:
          type:
            - number
            - "null"
        defaultBranchId:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
        deletedAt:
          type:
            - string
            - "null"
          format: date-time
        commitUrlBase:
          type:
            - string
            - "null"
      required:
        - id
        - vcsId
        - projectPath
        - vcsProjectId
        - defaultBranchId
        - name
        - deletedAt
        - commitUrlBase
    IAppCreateInput:
      type: object
      properties:
        name:
          type: string
        vcsId:
          type: string
        projectPath:
          type: string
        vcsProjectId:
          type: number
        defaultBranchName:
          type: string
      required:
        - name
        - vcsId
        - projectPath
    IAppUpdateInput:
      type: object
      properties:
        defaultBranchId:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
    IVcsProject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        projectPath:
          type: string
        webUrl:
          type: string
        description:
          type: string
        defaultBranch:
          type: string
      required:
        - id
        - name
        - projectPath
        - webUrl
        - description
    IBranchResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
      required:
        - id
        - name
    IBuildResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        branchId:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        createdAt:
          type: string
          format: date-time
        commitHash:
          type: string
        commitSubject:
          type: string
        commitAuthor:
          type: string
        status:
          enum:
            - draft
            - processing
            - no changes
            - needs review
            - changes approved
            - changes rejected
            - canceled
            - failed
          type: string
        branchName:
          type: string
      required:
        - id
        - branchId
        - createdAt
        - commitHash
        - commitSubject
        - commitAuthor
        - status
        - branchName
    IBuildBasicResponse:
      type: object
      properties:
        status:
          enum:
            - draft
            - processing
            - no changes
            - needs review
            - changes approved
            - changes rejected
            - canceled
            - failed
          type: string
      required:
        - status
    IBuildApprovalResponse:
      type: object
      properties:
        vcsUrl:
          oneOf:
            - type: string
            - type: boolean
              enum:
                - false
      required:
        - vcsUrl
    IBuildScreenResponse:
      type: object
      properties:
        screenId:
          type: string
        name:
          type: string
        currentBuildScreen:
          $ref: "#/components/schemas/PickBuildScreenEntity"
        referenceBuildScreen:
          $ref: "#/components/schemas/PickBuildScreenEntity"
      required:
        - screenId
        - name
    PickBuildScreenEntity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        buildId:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        screenId:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        matchedBuildId:
          type:
            - string
